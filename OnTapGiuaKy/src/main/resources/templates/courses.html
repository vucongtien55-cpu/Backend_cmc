<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Khóa học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">Quản lý Khóa học</h2>
        <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#courseModal">
            + Thêm khóa học
        </button>
    </div>

    <!-- Form Tìm kiếm & Bộ lọc -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/courses}">
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label">Từ khóa</label>
                        <input type="text" class="form-control" name="keyword" th:value="${param.keyword}" placeholder="Tìm theo tên...">
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Loại khóa học</label>
                        <select class="form-select" name="categoryId">
                            <option value="">-- Tất cả --</option>
                            <option th:each="category : ${categories}"
                                    th:value="${category.id}"
                                    th:text="${category.name}"
                                    th:selected="${param.categoryId != null and param.categoryId[0] == #strings.toString(category.id)}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Trạng thái</label>
                        <select class="form-select" name="isActive">
                            <option value="">-- Tất cả --</option>
                            <option value="true" th:selected="${param.isActive != null and param.isActive[0] == 'true'}">Đang tuyển sinh</option>
                            <option value="false" th:selected="${param.isActive != null and param.isActive[0] == 'false'}">Ngừng tuyển sinh</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Học phí tối thiểu</label>
                        <input type="number" class="form-control" name="minFee" min="0" step="1000" th:value="${param.minFee}">
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Học phí tối đa</label>
                        <input type="number" class="form-control" name="maxFee" min="0" step="1000" th:value="${param.maxFee}">
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Sắp xếp theo</label>
                        <select class="form-select" name="sortBy">
                            <option value="tuitionFee" th:selected="${param.sortBy == null or param.sortBy[0] == 'tuitionFee'}">Học phí</option>
                            <option value="duration" th:selected="${param.sortBy != null and param.sortBy[0] == 'duration'}">Thời lượng</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Hướng</label>
                        <select class="form-select" name="sortDir">
                            <option value="desc" th:selected="${param.sortDir == null or param.sortDir[0] == 'desc'}">Giảm dần</option>
                            <option value="asc" th:selected="${param.sortDir != null and param.sortDir[0] == 'asc'}">Tăng dần</option>
                        </select>
                    </div>

                    <div class="col-md-2 d-flex gap-2">
                        <button class="btn btn-primary w-100" type="submit">Lọc</button>
                        <a class="btn btn-outline-secondary w-100" th:href="@{/courses}">Đặt lại</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Bảng danh sách khóa học -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Tên khóa học</th>
                        <th>Loại khóa học</th>
                        <th>Học phí</th>
                        <th>Thời lượng</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="course : ${courses}">
                        <td th:text="${course.id}">1</td>
                        <td class="fw-bold" th:text="${course.name}">Tên khóa học</td>
                        <td th:text="${course.category != null ? course.category.name : '---'}">Loại</td>
                        <td th:text="${course.tuitionFee != null ? #numbers.formatDecimal(course.tuitionFee, 0, 'COMMA', 0, 'POINT') + ' VNĐ' : '0 VNĐ'}">0 VNĐ</td>
                        <td>
                            <span class="badge" th:classappend="${course.durationType == 'Ngắn hạn'} ? 'bg-info text-dark' : 'bg-warning text-dark'"
                                  th:text="${course.durationType}">Ngắn hạn</span>
                            <span class="ms-1 small text-muted" th:text="${course.duration + ' giờ'}">30 giờ</span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${course.isActive} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${course.isActive ? 'Đang tuyển sinh' : 'Ngừng tuyển sinh'}">Đang tuyển sinh</span>
                        </td>
                        <td>
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/courses/{id}(id=${course.id})}">Xem chi tiết</a>
                            <button class="btn btn-sm btn-outline-warning ms-1" type="button"
                                    data-bs-toggle="modal" data-bs-target="#courseModal"
                                    th:attr="data-id=${course.id},data-name=${course.name},data-tuitionFee=${course.tuitionFee},data-duration=${course.duration},data-description=${course.description},data-isActive=${course.isActive},data-categoryId=${course.category != null ? course.category.id : ''}">
                                Sửa
                            </button>
                            <a class="btn btn-sm btn-outline-danger ms-1" th:href="@{/courses/delete/{id}(id=${course.id})}" onclick="return confirm('Bạn có chắc chắn muốn xóa khóa học này?');">Xóa</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(courses)}">
                        <td colspan="7" class="text-center text-muted py-4">Không có dữ liệu khóa học nào.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal Thêm / Cập nhật khóa học -->
<div class="modal fade" id="courseModal" tabindex="-1" aria-labelledby="courseModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <form id="courseForm" th:action="@{/courses/create}" method="post" th:object="${courseDto}">
                <div class="modal-header">
                    <h5 class="modal-title" id="courseModalLabel">Thêm / Cập nhật khóa học</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id" id="courseId" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label fw-bold">Tên khóa học</label>
                        <input type="text" class="form-control" th:field="*{name}" placeholder="Nhập tên khóa học" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Loại khóa học</label>
                            <select class="form-select" th:field="*{category.id}" required>
                                <option value="">-- Chọn loại khóa học --</option>
                                <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('category.id')}" th:errors="*{category.id}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Trạng thái</label>
                            <select class="form-select" th:field="*{isActive}">
                                <option value="true">Đang tuyển sinh</option>
                                <option value="false">Ngừng tuyển sinh</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mt-1">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Học phí (VNĐ)</label>
                            <input type="number" class="form-control" th:field="*{tuitionFee}" min="1" step="1000" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('tuitionFee')}" th:errors="*{tuitionFee}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Thời lượng (Giờ)</label>
                            <input type="number" class="form-control" th:field="*{duration}" min="1" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}"></div>
                        </div>
                    </div>

                    <div class="mt-3">
                        <label class="form-label fw-bold">Mô tả</label>
                        <textarea class="form-control" rows="3" th:field="*{description}" placeholder="Mô tả thông tin khóa học..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-primary">Lưu thông tin</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const courseModal = document.getElementById('courseModal');

    courseModal.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;
        const form = document.getElementById('courseForm');
        const id = button?.getAttribute('data-id');

        document.getElementById('courseId').value = id || '';
        form.action = id ? '/courses/edit/' + id : '/courses/create';

        if (button && id) {
            document.querySelector('#courseModal [name="name"]').value = button.getAttribute('data-name') || '';
            document.querySelector('#courseModal [name="tuitionFee"]').value = button.getAttribute('data-tuitionFee') || '';
            document.querySelector('#courseModal [name="duration"]').value = button.getAttribute('data-duration') || '';
            document.querySelector('#courseModal [name="description"]').value = button.getAttribute('data-description') || '';
            document.querySelector('#courseModal [name="isActive"]').value = button.getAttribute('data-isActive') || 'true';
            document.querySelector('#courseModal [name="category.id"]').value = button.getAttribute('data-categoryId') || '';
        } else {
            document.querySelector('#courseModal [name="name"]').value = '';
            document.querySelector('#courseModal [name="tuitionFee"]').value = '';
            document.querySelector('#courseModal [name="duration"]').value = '';
            document.querySelector('#courseModal [name="description"]').value = '';
            document.querySelector('#courseModal [name="isActive"]').value = 'true';
            document.querySelector('#courseModal [name="category.id"]').value = '';
        }
    });
</script>
</body>
</html>
