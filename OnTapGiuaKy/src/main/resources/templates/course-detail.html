<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết khóa học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .course-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">Chi tiết khóa học</h2>
        <a th:href="@{/courses}" class="btn btn-outline-secondary">Quay lại</a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="row g-4">
                <div class="col-md-8">
                    <h3 class="mb-3" th:text="${course.name}">Tên khóa học</h3>
                    <div class="mb-2">
                        <span class="badge bg-primary me-2" th:text="${course.category != null ? course.category.name : 'Chưa phân loại'}">Loại</span>
                        <span class="badge bg-info text-dark" th:text="${course.durationType}">Ngắn hạn</span>
                    </div>
                    <p class="text-muted mb-2">
                        <strong>Học phí:</strong>
                        <span th:text="${#numbers.formatDecimal(course.tuitionFee, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</span>
                    </p>
                    <p class="text-muted mb-2">
                        <strong>Thời lượng:</strong>
                        <span th:text="${course.duration} + ' ngày'">30 ngày</span>
                    </p>
                    <p class="mb-0" th:text="${course.description != null ? course.description : 'Chưa có mô tả'}">Mô tả</p>
                </div>
                <div class="col-md-4">
                    <div class="border rounded p-3 bg-light h-100">
                        <p class="fw-semibold mb-2">Trạng thái</p>
                        <span class="badge fs-6" th:classappend="${course.isActive} ? 'bg-success' : 'bg-secondary'"
                              th:text="${course.isActive ? 'Đang tuyển sinh' : 'Ngừng tuyển sinh'}">Đang tuyển sinh</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="card-title mb-3">Thêm ảnh mới</h5>
            <form th:action="@{/courses/{id}/add-image(id=${course.id})}" method="post">
                <div class="input-group">
                    <input type="text" class="form-control" name="imageUrl" placeholder="Nhập URL ảnh..." required>
                    <button type="submit" class="btn btn-primary">Thêm ảnh</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3">Danh sách ảnh</h5>
            <div class="row g-3" th:if="${not #lists.isEmpty(course.images)}">
                <div class="col-md-4" th:each="image : ${course.images}">
                    <div class="card h-100 border">
                        <img th:src="${image.imageUrl}" class="course-image" alt="Course image">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="badge bg-primary" th:if="${image.isThumbnail}">Ảnh đại diện</span>
                                <span class="badge bg-secondary" th:unless="${image.isThumbnail}">Ảnh thường</span>
                            </div>

                            <form th:action="@{/courses/images/{imageId}/set-thumbnail(imageId=${image.id})}" method="post">
                                <button type="submit" class="btn btn-outline-primary btn-sm w-100"
                                        th:disabled="${image.isThumbnail}">
                                    <span th:if="${image.isThumbnail}">Đã là ảnh đại diện</span>
                                    <span th:unless="${image.isThumbnail}">Đặt làm ảnh đại diện</span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center text-muted py-4" th:if="${#lists.isEmpty(course.images)}">
                Chưa có ảnh nào cho khóa học này.
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
